# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-abdulsatar"
BBFILE_PATTERN_meta-abdulsatar = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-abdulsatar = "6"

LAYERDEPENDS_meta-abdulsatar = "core"
LAYERSERIES_COMPAT_meta-abdulsatar = "wrynose"
