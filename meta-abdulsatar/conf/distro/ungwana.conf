DISTRO = "ungwana"
DISTRO_NAME = "Ungwana: Custom Embedded Linux for i.MX 91"
DISTRO_VERSION = "0.1"
MAINTAINER = "Abdulsatar Aboud <sataraboud@gmail.com>"

# Policy: systemd, no graphics stack, small and auditable.
INIT_MANAGER = "systemd"

# Wrynose appends DISTRO_FEATURES_DEFAULTS minus DISTRO_FEATURES_OPTED_OUT.
# So: list what I ADD beyond the defaults, and opt OUT of what I don't want.
DISTRO_FEATURES = "pam wifi"
DISTRO_FEATURES_OPTED_OUT = "alsa bluetooth debuginfod nfs zeroconf pci 3g nfc \
                             x11 pulseaudio opengl ptest multiarch wayland vulkan"

# Hardening (security_flags.inc) and uninative are already applied to every
# distro by OE-Core's conf/distro/defaultsetup.conf. Not repeated here.

# Licences: GPLv3 decision pending; see notes.
# INCOMPATIBLE_LICENSE = "GPL-3.0* LGPL-3.0* AGPL-3.0*"
